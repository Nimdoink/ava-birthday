<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff0f5">
    <meta name="description" content="A pink-and-gold birthday wish for Ava.">
    <title>Happy 21st Birthday, Ava!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="confetti-layer confetti-layer-back" id="confetti-back" aria-hidden="true"></div>
    <main class="birthday-scene">
      <div class="birthday-card">
        <p class="birthday-heading">
          <span>Happy 21st</span>
          <span>Birthday Ava <span class="birthday-heart" aria-label="heart">💖</span></span>
        </p>
        <p class="birthday-message">I Love You</p>
        <span class="gold-sparkle sparkle-left" aria-hidden="true">✦</span>
        <span class="gold-sparkle sparkle-right" aria-hidden="true">✧</span>
      </div>
    </main>
    <div class="confetti-layer confetti-layer-front" id="confetti-front" aria-hidden="true"></div>
  </body>
</html>
